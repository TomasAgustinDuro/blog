# Integración continua: valida lint y build en cada PR hacia develop o main.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:3000

  backend:
    name: Backend (install + prisma + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci
      # Chequeo de sintaxis rápido, antes de correr los tests.
      - name: Syntax check
        run: find . -name node_modules -prune -o -name "*.js" -print0 | xargs -0 -n1 node --check
      - run: npm test
