# Configuración de Dependabot.
#
# - Una vez por mes, un único PR por carpeta con las actualizaciones
#   minor/patch agrupadas (más una para las GitHub Actions).
# - Los saltos de versión mayor se ignoran: se hacen a mano, en una rama
#   propia (ejemplos: Prisma 7, Express 5, Vite 8, ESLint 10).
# - Las actualizaciones de seguridad NO se ven afectadas por `ignore` ni por
#   el calendario: siguen llegando como PRs aparte.
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"
    groups:
      # TipTap y ProseMirror deben subir juntos para no romper el editor.
      editor:
        patterns:
          - "@tiptap/*"
          - "prosemirror-*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/backend"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"
    groups:
      # prisma y @prisma/client siempre deben tener la misma versión.
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Incluye Prisma 7, que requiere migración manual (generador, adapter).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(ci)"
    groups:
      actions:
        patterns:
          - "*"
